name: Automerge EPP package renovate PRs
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  automerge:
    if: |
      github.actor == 'renovate[bot]' &&
      startsWith(github.head_ref, 'renovate/ghcr.io-elifesciences-enhanced-preprints-client')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --merge --repo "${{ github.repository }}" "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}